name: Backend CI/CD

on:
  push:
    branches:
      - development
      - staging
      - production
    paths:
      - "src/**"
      - "build.gradle"
      - "settings.gradle"
      - "Dockerfile"
      - ".github/workflows/**"

# Auto-cancel previous runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/fitnest-backend/api-gateway
  HELM_REPO_URL: git@github.com:fitnest-chart/api-gateway.git
  HELM_VALUES_FILE: values.yaml

jobs:
# -------------------------
# Docker Build & Push Job
# -------------------------
  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set image variables
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "IMAGE_BRANCH=${GITHUB_REF_NAME}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_BRANCH }}-${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_BRANCH }}
          cache-from: |
            type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
            type=gha
          cache-to: |
            type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max
            type=gha,mode=max

# -------------------------
# Helm Chart Update Job
# -------------------------
  update-helm-chart:
    name: Update Helm Chart
    runs-on: ubuntu-latest
    needs: docker-build
    if: |
      github.ref_name == 'development' ||
      github.ref_name == 'staging' ||
      github.ref_name == 'production'
    
    steps:
      - name: Checkout Helm repo
        uses: actions/checkout@v4
        with:
          repository: fitnest-chart/api-gateway
          path: helm-repo
          ref: ${{ github.ref_name }}
          ssh-key: ${{ secrets.CHART_REPO_SSH_PRIVATE_KEY_B64 }}
          fetch-depth: 1

      - name: Install yq
        uses: mikefarah/yq@v4

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Update Helm values
        run: |
          cd helm-repo
          git checkout ${{ github.ref_name }} || git checkout -b ${{ github.ref_name }}
          
          yq eval -i '.image.tag = strenv(IMAGE_TAG)' $HELM_VALUES_FILE
          
          if git diff --quiet; then
            echo "No changes to commit"
          else
            git add $HELM_VALUES_FILE
            git commit -m "chore: update image tag to $IMAGE_TAG [skip ci]"
            git push origin ${{ github.ref_name }}
            echo "✅ Helm chart updated successfully"

# -------------------------
# ArgoCD Sync Job
# -------------------------
  sync-argocd:
    name: Sync ArgoCD
    runs-on: ubuntu-latest
    needs: update-helm-chart
    if: github.ref_name == 'development'
    
    steps:
      - name: Trigger ArgoCD Sync
        run: |
          curl -k -X POST \
            -H "Authorization: Bearer ${{ secrets.ARGOCD_TOKEN }}" \
            https://argocd.your-domain/api/v1/applications/fitnest-api-gateway-dev/sync
