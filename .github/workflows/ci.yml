name: Backend CI/CD

on:
  push:
    branches: [ development, staging, production ]
    paths:
      - "src/**"
      - "gradle/**"
      - "gradlew"
      - "build.gradle"
      - "settings.gradle"
      - "Dockerfile"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: fitnest-backend/api-gateway
  HELM_REPO: fitnest-chart/api-gateway
  HELM_VALUES_FILE: values.yaml

# =========================================
# 1) BUILD & PUSH IMAGE
# =========================================
jobs:
  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      # Improves Gradle dependency caching inside Docker
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Auto generate tags
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=${{ github.ref_name }}

      - name: Build & Push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
            type=gha
          cache-to: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
            type=gha,mode=max

# =========================================
# 2) UPDATE HELM CHART
# =========================================
  update-helm-chart:
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CHART_REPO_SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Checkout Helm repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HELM_REPO }}
          ssh-key: ~/.ssh/id_rsa
          ref: ${{ github.ref_name }}
          path: helm-repo

      - uses: mikefarah/yq@v4

      - name: Update image tag in Helm values
        run: |
          cd helm-repo
          TAG=${{ needs.docker-build.outputs.image_tag }}
          yq -i '.image.tag = strenv(TAG)' $HELM_VALUES_FILE

          if git diff --quiet; then
            echo "No Helm changes"
          else
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add $HELM_VALUES_FILE
            git commit -m "chore: update image tag to $TAG [skip ci]"
            git push origin ${{ github.ref_name }}
          fi

# =========================================
# 3) TRIGGER ARGOCD (DEV ONLY)
# =========================================
  sync-argocd:
    runs-on: ubuntu-latest
    needs: update-helm-chart
    if: github.ref_name == 'development'

    steps:
      - name: Trigger ArgoCD Sync
        run: |
          curl -k -X POST \
          -H "Authorization: Bearer ${{ secrets.ARGOCD_TOKEN }}" \
          https://argocd.your-domain/api/v1/applications/fitnest-api-gateway-dev/sync
