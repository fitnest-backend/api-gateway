plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.3'
    id 'io.spring.dependency-management' version '1.1.7'

}

group = 'az.fitnest'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2025.1.1"
    }
}

bootJar {
    archiveFileName = "api-gateway.jar"
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // SpringDoc: Boot 4 compatible major line
    implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:3.0.1'

    // JJWT: latest stable + correct classpath split
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly  'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly  'io.jsonwebtoken:jjwt-jackson:0.13.0'

    implementation 'org.springframework.retry:spring-retry'

    // Boot 4 is Jakarta-based; keep Jakarta annotation if you need @PostConstruct, etc.
    implementation 'jakarta.annotation:jakarta.annotation-api'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

}




tasks.named('test') {
    enabled = false
}

sourceSets.main.java.srcDirs = ['src/main/java', 'build/generated/source/proto/main/java', 'build/generated/source/proto/main/grpc']

tasks.withType(JavaCompile) {
    sourceCompatibility = '25'
    targetCompatibility = '25'
    options.encoding = 'UTF-8'
}
