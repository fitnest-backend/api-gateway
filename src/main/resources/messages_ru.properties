# General Errors
error.gateway_unexpected=Произошла непредвиденная ошибка в API Gateway
error.invalid_json_format=Неверный формат запроса
error.service_unavailable=Запрошенная служба в данный момент недоступна. Пожалуйста, попробуйте позже.
error.service_not_found=Запрошенная служба не найдена. Возможно, она отключена или недоступна.
error.gateway_timeout=Истекло время ожидания ответа от службы.
error.connection_failed=Не удалось подключиться к запрошенной службе. Пожалуйста, попробуйте позже.
error.service_problem=В службе возникла проблема. Пожалуйста, попробуйте позже.
error.communication_error=Ошибка связи со службой
error.resource_not_found=Запрошенная служба или ресурс не найдены.
error.generic_request_error=Произошла ошибка при обработке вашего запроса
error.bad_request=Неверный запрос
error.not_found=Ресурс не найден
