server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:redis.fitnest-dev.svc.cluster.local}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:2000ms}
  cloud:
    gateway:
      routes:
        - id: iam-service
          uri: http://fitnest-iam-service-dev:8080
          predicates:
            - Path=/api/v1/auth/**,/api/v1/admin/**,/api/v1/users/**,/api/v1/profiles/**
          filters:
            - StripPrefix=0
            - RequestRateLimiter=redisRateLimiter
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
            - name: Retry
              args:
                retries: 3
                methods: GET,POST,PUT,DELETE
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms

        - id: media-service
          uri: http://fitnest-media-service-dev:8086
          predicates:
            - Path=/api/v1/media/**
          filters:
            - StripPrefix=0
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
            - name: Retry
              args:
                retries: 3
                methods: GET,POST,PUT,DELETE
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms

        # OpenAPI doc proxy routes
        - id: iam-service-openapi
          uri: http://fitnest-iam-service-dev:8080
          predicates:
            - Path=/v3/api-docs/iam-service
          filters:
            - SetPath=/v3/api-docs
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

        - id: media-service-openapi
          uri: http://fitnest-media-service-dev:8086
          predicates:
            - Path=/v3/api-docs/media-service
          filters:
            - SetPath=/v3/api-docs
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

        - id: media-service-swagger-assets
          uri: http://fitnest-media-service-dev:8086
          predicates:
            - Path=/swagger/**
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

# Removed Eureka configuration as it conflicts with Kubernetes/Istio DNS

resilience4j:
  circuitbreaker:
    instances:
      iam-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
      media-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
  timelimiter:
    instances:
      iam-service:
        timeoutDuration: 30s
        cancelRunningFuture: true
      media-service:
        timeoutDuration: 30s
        cancelRunningFuture: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
    urls:
      - url: /v3/api-docs/iam-service
        name: fitnest-iam-service-dev
      - url: /v3/api-docs/media-service
        name: fitnest-media-service-dev
