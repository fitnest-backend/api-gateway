server:
  port: 8080
  forward-headers-strategy: framework
  http2:
    enabled: ${SERVER_HTTP2_ENABLED:true}
  compression:
    enabled: true
    mime-types: application/json,text/plain,text/css,application/javascript,application/openapi+json
    min-response-size: 2048

spring:
  application:
    name: api-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    lazy-initialization: ${SPRING_MAIN_LAZY_INITIALIZATION:false}
  data:
    redis:
      host: ${SPRING_REDIS_HOST:${REDIS_HOST:redis}}
      port: ${SPRING_REDIS_PORT:${REDIS_PORT:6379}}
      timeout: ${SPRING_REDIS_TIMEOUT:${REDIS_TIMEOUT:2000ms}}
  
  cloud:
    openfeign:
      httpclient:
        hc5:
          enabled: true
          pool:
            max-connections: ${FEIGN_MAX_CONNECTIONS:200}
            max-connections-per-route: ${FEIGN_CONNECTIONS_PER_ROUTE:50}
            conn-pool-policy: LIFO
      client:
        config:
          default:
            connect-timeout: ${FEIGN_CONNECT_TIMEOUT:5000}
            read-timeout: ${FEIGN_READ_TIMEOUT:10000}
            logger-level: BASIC
    gateway:
      routes:
        - id: identity-service
          uri: http://identity-service:8080
          predicates:
            - Path=/api/v1/auth/**,/api/v1/admin/**
          filters:
            - StripPrefix=0
            - RequestRateLimiter=redisRateLimiter

        - id: media-service
          uri: http://media-service:8086
          predicates:
            - Path=/api/v1/media/**
          filters:
            - StripPrefix=0

        - id: catalog-service
          uri: http://catalog-service:8080
          predicates:
            - Path=/api/v1/catalog/**,/api/v1/categories/**,/api/v1/products/**
          filters:
            - StripPrefix=0

        - id: commerce-service
          uri: http://commerce-service:8080
          predicates:
            - Path=/api/v1/cart/**,/api/v1/orders/**
          filters:
            - StripPrefix=0

        - id: marketplace-service
          uri: http://marketplace-service:8080
          predicates:
            - Path=/api/v1/trainers/**,/api/v1/programs/**
          filters:
            - StripPrefix=0

        - id: notifications-service
          uri: http://notifications-service:8080
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - StripPrefix=0

        - id: payment-service
          uri: http://payment-service:8080
          predicates:
            - Path=/api/v1/payments/**,/api/v1/wallets/**
          filters:
            - StripPrefix=0

        - id: subscription-service
          uri: http://subscription-service:8080
          predicates:
            - Path=/api/v1/subscriptions/**
          filters:
            - StripPrefix=0

        - id: support-service
          uri: http://support-service:8080
          predicates:
            - Path=/api/v1/support/**,/api/v1/tickets/**
          filters:
            - StripPrefix=0

        - id: fitness-plan-service
          uri: http://fitness-plan-service:8080
          predicates:
            - Path=/api/v1/nutrition-plans/**,/api/v1/workout-plans/**
          filters:
            - StripPrefix=0

        - id: argocd
          uri: http://argocd-server.argocd.svc:8080
          predicates:
            - Path=/api/v1/applications/**,/api/v1/stream/applications/**
          filters:
            - StripPrefix=0

        - id: user-service
          uri: http://user-service:8080
          predicates:
            - Path=/api/v1/users/**,/api/v1/me,/api/v1/me/**
          filters:
            - StripPrefix=0
            - RequestRateLimiter=redisRateLimiter

        # OpenAPI doc proxy routes
        - id: identity-service-openapi
          uri: http://identity-service:8080
          predicates:
            - Path=/v3/api-docs/identity-service
          filters:
            - SetPath=/v3/api-docs

        - id: media-service-openapi
          uri: http://media-service:8086
          predicates:
            - Path=/v3/api-docs/media-service
          filters:
            - SetPath=/v3/api-docs

        - id: catalog-service-openapi
          uri: http://catalog-service:8080
          predicates:
            - Path=/v3/api-docs/catalog-service
          filters:
            - SetPath=/v3/api-docs

        - id: commerce-service-openapi
          uri: http://commerce-service:8080
          predicates:
            - Path=/v3/api-docs/commerce-service
          filters:
            - SetPath=/v3/api-docs

        - id: marketplace-service-openapi
          uri: http://marketplace-service:8080
          predicates:
            - Path=/v3/api-docs/marketplace-service
          filters:
            - SetPath=/v3/api-docs

        - id: notifications-service-openapi
          uri: http://notifications-service:8080
          predicates:
            - Path=/v3/api-docs/notifications-service
          filters:
            - SetPath=/v3/api-docs

        - id: payment-service-openapi
          uri: http://payment-service:8080
          predicates:
            - Path=/v3/api-docs/payment-service
          filters:
            - SetPath=/v3/api-docs

        - id: subscription-service-openapi
          uri: http://subscription-service:8080
          predicates:
            - Path=/v3/api-docs/subscription-service
          filters:
            - SetPath=/v3/api-docs

        - id: support-service-openapi
          uri: http://support-service:8080
          predicates:
            - Path=/v3/api-docs/support-service
          filters:
            - SetPath=/v3/api-docs

        - id: user-service-openapi
          uri: http://user-service:8080
          predicates:
            - Path=/v3/api-docs/user-service
          filters:
            - SetPath=/v3/api-docs

        - id: fitness-plan-service-openapi
          uri: http://fitness-plan-service:8080
          predicates:
            - Path=/v3/api-docs/fitness-plan-service
          filters:
            - SetPath=/v3/api-docs


# Removed Eureka configuration as it conflicts with Kubernetes/Istio DNS

resilience4j:
  circuitbreaker:
    instances:
      identity-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
      media-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
  timelimiter:
    instances:
      identity-service:
        timeoutDuration: 30s
        cancelRunningFuture: true
      media-service:
        timeoutDuration: 30s
        cancelRunningFuture: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

springdoc:
  swagger-ui:
    use-root-path-mapping: true
    doc-expansion: none
    filter: true
    display-request-duration: true
    try-it-out-enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
    urls:
      - url: /v3/api-docs/identity-service
        name: identity-service
      - url: /v3/api-docs/media-service
        name: media-service
      - url: /v3/api-docs/catalog-service
        name: catalog-service
      - url: /v3/api-docs/commerce-service
        name: commerce-service
      - url: /v3/api-docs/marketplace-service
        name: marketplace-service
      - url: /v3/api-docs/notifications-service
        name: notifications-service
      - url: /v3/api-docs/payment-service
        name: payment-service
      - url: /v3/api-docs/subscription-service
        name: subscription-service
      - url: /v3/api-docs/support-service
        name: support-service
      - url: /v3/api-docs/user-service
        name: user-service
      - url: /v3/api-docs/fitness-plan-service
        name: fitness-plan-service
