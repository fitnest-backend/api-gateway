server:
  port: 8080
  forward-headers-strategy: framework
  http2:
    enabled: ${SERVER_HTTP2_ENABLED:true}
  compression:
    enabled: true
    mime-types: application/json,text/plain,text/css,application/javascript,application/openapi+json
    min-response-size: 2048

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: gateway-backend-trace
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    web-application-type: reactive
    lazy-initialization: false
  messages:
    encoding: UTF-8
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${REDIS_HOST:redis}}
      port: ${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:${REDIS_TIMEOUT:2000ms}}

  cloud:
    gateway:
      httpclient:
        connect-timeout: 2000
        response-timeout: 15s
      routes:
        - id: identity-backend
          uri: http://identity-backend:8080
          predicates:
            - Path=/api/v1/identity/**,/api/v1/auth/**,/api/v1/legal/**,/api/v1/admin/legal/**,/api/v1/admin/users/**,/api/v1/admin/roles/**,/api/v1/internal/users/**,/api/v1/me/**
          filters:
            - StripPrefix=0

        - id: catalog-backend
          uri: http://catalog-backend:8080
          predicates:
            - Path=/api/v1/admin/stores/**,/api/v1/admin/gyms/**,/api/v1/admin/translations/**,/api/v1/admin/categories/**,/api/v1/categories/**,/api/v1/gyms/**,/api/v1/stores/**,/api/v1/media/stream/**
          filters:
            - StripPrefix=0

        - id: notifications-backend
          uri: http://notifications-backend:8080
          predicates:
            - Path=/api/v1/notifications/**,/api/v1/devices/**,/api/v1/sms/**,/api/v1/admin/notifications/**,/api/v1/admin/devices/**
          filters:
            - StripPrefix=0

        - id: payment-backend
          uri: http://payment-backend:8080
          predicates:
            - Path=/api/v1/me/payments/**,/api/v1/me/cards/**,/api/heartbeat,/payment/**
          filters:
            - StripPrefix=0

        - id: support-backend
          uri: http://support-backend:8080
          predicates:
            - Path=/api/v1/admin/faqs/**,/api/v1/admin/faq-categories/**,/api/v1/admin/support/**,/api/v1/support/**,/api/v1/faqs/**,/api/v1/faq-categories/**,/api/v1/tickets/**
          filters:
            - StripPrefix=0

        - id: fitness-plan-backend
          uri: http://fitness-plan-backend:8080
          predicates:
            - Path=/api/v1/nutrition-plans/**,/api/v1/workout-plans/**
          filters:
            - StripPrefix=0

        - id: argocd
          uri: http://argocd-server.argocd.svc:8080
          predicates:
            - Path=/api/v1/applications/**,/api/v1/stream/applications/**
          filters:
            - StripPrefix=0

        - id: order-backend
          uri: http://order-backend:8080
          predicates:
            - Path=/api/v1/subscription-packages/**,/api/v1/me/subscriptions/**,/api/v1/subscriptions/**,/api/v1/orders/**,/api/v1/admin/subscriptions/**,/api/v1/admin/plans/**,/api/v1/admin/subscription-packages/**,/admin/subscription/**
          filters:
            - StripPrefix=0

        - id: user-backend
          uri: http://user-backend:8080
          predicates:
            - Path=/api/v1/admin/goals/**,/api/v1/bmi/**,/api/v1/recent-searches/**,/api/v1/goals/**,/api/v1/languages/**,/api/v1/translations/**,/api/v1/me/summary,/api/v1/me/**
          filters:
            - StripPrefix=0

        # ========== OpenAPI routes ==========
        - id: identity-openapi
          uri: http://identity-backend:8080
          predicates:
            - Path=/v3/api-docs/identity-backend
          filters:
            - SetPath=/v3/api-docs

        - id: catalog-openapi
          uri: http://catalog-backend:8080
          predicates:
            - Path=/v3/api-docs/catalog-backend
          filters:
            - SetPath=/v3/api-docs

        - id: notifications-openapi
          uri: http://notifications-backend:8080
          predicates:
            - Path=/v3/api-docs/notifications-backend
          filters:
            - SetPath=/v3/api-docs

        - id: payment-openapi
          uri: http://payment-backend:8080
          predicates:
            - Path=/v3/api-docs/payment-backend
          filters:
            - SetPath=/v3/api-docs

        - id: support-openapi
          uri: http://support-backend:8080
          predicates:
            - Path=/v3/api-docs/support-backend
          filters:
            - SetPath=/v3/api-docs

        - id: user-openapi
          uri: http://user-backend:8080
          predicates:
            - Path=/v3/api-docs/user-backend
          filters:
            - SetPath=/v3/api-docs

        - id: fitness-plan-openapi
          uri: http://fitness-plan-backend:8080
          predicates:
            - Path=/v3/api-docs/fitness-plan-backend
          filters:
            - SetPath=/v3/api-docs

        - id: order-openapi
          uri: http://order-backend:8080
          predicates:
            - Path=/v3/api-docs/order-backend
          filters:
            - SetPath=/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

springdoc:
  pre-loading-enabled: true
  swagger-ui:
    use-root-path-mapping: true
    urls:
      - url: /v3/api-docs/identity-backend
        name: identity-backend
      - url: /v3/api-docs/catalog-backend
        name: catalog-backend
      - url: /v3/api-docs/notifications-backend
        name: notifications-backend
      - url: /v3/api-docs/payment-backend
        name: payment-backend
      - url: /v3/api-docs/support-backend
        name: support-backend
      - url: /v3/api-docs/user-backend
        name: user-backend

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: TRACE
    org.springframework.cloud: TRACE
    org.springframework.security: DEBUG
    org.springframework.boot: DEBUG
    az.fitnest.gateway: DEBUG