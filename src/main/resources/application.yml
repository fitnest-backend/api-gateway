server:
  port: 8080
  forward-headers-strategy: framework
  http2:
    enabled: ${SERVER_HTTP2_ENABLED:true}
  compression:
    enabled: true
    mime-types: application/json,text/plain,text/css,application/javascript,application/openapi+json
    min-response-size: 2048

spring:

  threads:
    virtual:
      enabled: true
  application:
    name: api-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    web-application-type: reactive
    lazy-initialization: ${SPRING_MAIN_LAZY_INITIALIZATION:false}
  messages:
    encoding: UTF-8
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${REDIS_HOST:redis}}
      port: ${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:${REDIS_TIMEOUT:2000ms}}
  
  cloud:
    openfeign:
      httpclient:
        hc5:
          enabled: true
          pool:
            max-connections: ${FEIGN_MAX_CONNECTIONS:200}
            max-connections-per-route: ${FEIGN_CONNECTIONS_PER_ROUTE:50}
            conn-pool-policy: LIFO
      client:
        config:
          default:
            connect-timeout: ${FEIGN_CONNECT_TIMEOUT:5000}
            read-timeout: ${FEIGN_READ_TIMEOUT:10000}
            logger-level: BASIC
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 15s
          routes:
            - id: identity-service
              uri: http://identity-service:8080
              predicates:
                - Path=
                  /api/v1/identity/me,
                  /api/v1/me/change-email/request,
                  /api/v1/me/change-email/confirm,
                  /api/v1/me/change-mobile/request,
                  /api/v1/me/change-mobile/confirm,
                  /api/v1/me/change-password,
                  /api/v1/me/delete-account,
                  /api/v1/me/change-email/resend,
                  /api/v1/me/change-mobile/resend,
                  /api/v1/auth/login,
                  /api/v1/auth/refresh,
                  /api/v1/auth/logout,
                  /api/v1/auth/social/apple,
                  /api/v1/auth/social/google,
                  /api/v1/auth/registration/register,
                  /api/v1/auth/registration/register/complete,
                  /api/v1/auth/password-recovery/forgot-password,
                  /api/v1/auth/password-recovery/reset-password,
                  /api/v1/auth/otp/verify,
                  /api/v1/auth/registration/register/resend,
                  /api/v1/legal/privacy-policy,
                  /api/v1/legal/terms-of-use,
                  /api/v1/legal/consents/me,
                  /api/v1/admin/legal/documents,
                  /api/v1/admin/legal/documents/{id},
                  /api/v1/admin/legal/documents/{id}/activate,
                  /api/v1/admin/legal/documents/{id}/deactivate,
                  /api/v1/admin/legal/consents,
                  /api/v1/admin/users,
                  /api/v1/admin/users/{userId}/role,
                  /api/v1/admin/users/all,
                  /api/v1/admin/users/{userId}/profile,
                  /api/v1/admin/users/rate-limit/reset,
                  /api/v1/admin/roles,
                  /api/v1/admin/roles/{roleId},
                  /api/v1/internal/users/{userId},
                  /api/v1/internal/users/{userId}/profile-image,
                  /api/v1/internal/users/{userId}/setup-required,
                  /api/v1/internal/users/{userId}/language,
                  /api/v1/internal/users/{userId}/session-status
              filters:
                - StripPrefix=0
                - RequestRateLimiter=redisRateLimiter

            - id: catalog-service
              uri: http://catalog-service:8080
              predicates:
                - Path=/api/v1/admin/stores,
                  /api/v1/admin/stores/{id},
                  /api/v1/admin/stores/{id}/logo,
                  /api/v1/admin/stores/{id}/cover,
                  /api/v1/admin/stores/all,
                  /api/v1/admin/gyms,
                  /api/v1/admin/gyms/{id},
                  /api/v1/admin/gyms/{id}/subscriptions/enable,
                  /api/v1/admin/gyms/{id}/subscriptions/{planId}/benefits,
                  /api/v1/admin/gyms/{id}/rooms,
                  /api/v1/admin/gyms/{id}/cover,
                  /api/v1/admin/gyms/all,
                  /api/v1/admin/categories,
                  /api/v1/admin/categories/all,
                  /api/v1/admin/categories/{categoryId}/name,
                  /api/v1/admin/categories/{categoryId}/photo,
                  /api/v1/admin/categories/{categoryId}/icon,
                  /api/v1/categories,
                  /api/v1/gyms/{gymId},
                  /api/v1/gyms/{gymId}/images,
                  /api/v1/gyms/{gymId}/qr,
                  /api/v1/gyms/{gymId}/trainers,
                  /api/v1/gyms/{gymId}/reviews,
                  /api/v1/gyms/{gymId}/reservation-rules,
                  /api/v1/gyms/{gymId}/location,
                  /api/v1/gyms/{gymId}/save,
                  /api/v1/gyms,
                  /api/v1/gyms/count,
                  /api/v1/gyms/count/by-type,
                  /api/v1/gyms/count/by-category,
                  /api/v1/gyms/count/by-subscription,
                  /api/v1/gyms/count/by-gender,
                  /api/v1/gyms/entrance/scan,
                  /api/v1/gyms/entrance/eligibility
              filters:
                - StripPrefix=0


            - id: notifications-service
              uri: http://notifications-service:8080
              predicates:
                - Path=/api/v1/notifications,
                  /api/v1/notifications/{id}/read,
                  /api/v1/notifications/read-all,
                  /api/v1/notifications/{id},
                  /api/v1/notifications/all,
                  /api/v1/devices/register,
                  /api/v1/devices,
                  /api/v1/devices/user/{userId},
                  /api/v1/devices/send,
                  /api/v1/sms/send,
                  /api/v1/sms/balance,
                  /api/v1/sms/report/{transactionId},
                  /api/v1/admin/notifications/broadcast
              filters:
                - StripPrefix=0

            - id: payment-service
              uri: http://payment-service:8080
              predicates:
                - Path=/api/v1/me/payments/history,
                  /api/v1/me/cards/default,
                  /api/v1/me/cards/{cardId},
                  /api/v1/me/cards,
                  /api/heartbeat,
                  /payment/result,
                  /payment/callback,
                  /payment/epoint/callback,
                  /payment/payment/init,
                  /payment/payment/status/{orderId},
                  /payment/card/save-init,
                  /payment/payment/with-card,
                  /payment/payment/save-and-pay,
                  /payment/refund,
                  /payment/reverse,
                  /payment/payment/split-init,
                  /payment/split/with-card,
                  /payment/payment/split-save-and-pay,
                  /payment/pre-auth-request,
                  /payment/pre-auth-complete,
                  /payment/widget-url,
                  /payment/wallet/status,
                  /payment/wallet/pay,
                  /payment/invoice/create,
                  /payment/invoice/update,
                  /payment/invoice/view/{id},
                  /payment/invoice/list,
                  /payment/invoice/send-sms/{id},
                  /payment/invoice/send-email/{id},
                  /payment/heartbeat
              filters:
                - StripPrefix=0

            - id: support-service
              uri: http://support-service:8080
              predicates:
                - Path=/api/v1/admin/faqs,
                  /api/v1/admin/faqs/{id},
                  /api/v1/admin/faq-categories,
                  /api/v1/admin/faq-categories/{id},
                  /api/v1/admin/support/tickets,
                  /api/v1/admin/support/tickets/{id}/status,
                  /api/v1/admin/support/contact-details,
                  /api/v1/support/contactDetails,
                  /api/v1/faqs,
                  /api/v1/faq-categories,
                  /api/v1/tickets,
                  /api/v1/tickets/{id}
              filters:
                - StripPrefix=0

            - id: fitness-plan-service
              uri: http://fitness-plan-service:8080
              predicates:
                - Path=/api/v1/nutrition-plans/**,/api/v1/workout-plans/**
              filters:
                - StripPrefix=0

            - id: argocd
              uri: http://argocd-server.argocd.svc:8080
              predicates:
                - Path=/api/v1/applications/**,/api/v1/stream/applications/**
              filters:
                - StripPrefix=0

            - id: order-service
              uri: http://order-service:8080
              predicates:
                - Path=/api/v1/subscription-packages/**,/api/v1/me/subscriptions/**,/api/v1/subscriptions/upgrade/**,/api/v1/orders/**,/api/v1/admin/subscriptions/**,/api/v1/admin/plans/**,/api/v1/admin/subscription-packages/**,/admin/subscription/**
              filters:
                - StripPrefix=0

            - id: user-service
              uri: http://user-service:8080
              predicates:
                - Path=/api/v1/admin/goals,
                  /api/v1/admin/goals/{code},
                  /api/v1/admin/goals/{code}/image,
                  /api/v1/bmi/calculate,
                  /api/v1/recent-searches,
                  /api/v1/recent-searches/all,
                  /api/v1/goals,
                  /api/v1/goals/{code},
                  /api/v1/goals/images/{fsId},
                  /api/v1/languages,
                  /api/v1/languages/{code},
                  /api/v1/translations,
                  /api/v1/translations/{entityType}/{entityId},
                  /api/v1/translations/goals,
                  /api/v1/translations/gender,
                  /api/v1/me/summary,
                  /api/v1/me,
                  /api/v1/me/location,
                  /api/v1/me/body,
                  /api/v1/me/profile-image,
                  /api/v1/me/goal,
                  /api/v1/me/preferences,
                  /api/v1/me/language,
                  /api/v1/me/languages,
                  /api/v1/me/setup,
                  /api/v1/me/setup/complete,
                  /api/v1/me/setup/skip,
                  /api/v1/me/fitness-level,
                  /api/v1/me/profile/images/{fsId}

              filters:
                - StripPrefix=0
                - RequestRateLimiter=redisRateLimiter


            - id: identity-service-openapi
              uri: http://identity-service:8080
              predicates:
                - Path=/v3/api-docs/identity-service
              filters:
                - SetPath=/v3/api-docs
                - name: Retry
                  args:
                    retries: 2
                    statuses: INTERNAL_SERVER_ERROR,BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                    methods: GET
                    backoff:
                      firstBackoff: 500ms
                      maxBackoff: 2000ms
                      factor: 2
              metadata:
                response-timeout: 15000

            - id: catalog-service-openapi
              uri: http://catalog-service:8080
              predicates:
                - Path=/v3/api-docs/catalog-service
              filters:
                - SetPath=/v3/api-docs
                - name: Retry
                  args:
                    retries: 2
                    statuses: INTERNAL_SERVER_ERROR,BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                    methods: GET
                    backoff:
                      firstBackoff: 500ms
                      maxBackoff: 2000ms
                      factor: 2
              metadata:
                response-timeout: 15000

            - id: notifications-service-openapi
              uri: http://notifications-service:8080
              predicates:
                - Path=/v3/api-docs/notifications-service
              filters:
                - SetPath=/v3/api-docs
                - name: Retry
                  args:
                    retries: 2
                    statuses: INTERNAL_SERVER_ERROR,BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                    methods: GET
                    backoff:
                      firstBackoff: 500ms
                      maxBackoff: 2000ms
                      factor: 2
              metadata:
                response-timeout: 15000

            - id: payment-service-openapi
              uri: http://payment-service:8080
              predicates:
                - Path=/v3/api-docs/payment-service
              filters:
                - SetPath=/v3/api-docs
                - name: Retry
                  args:
                    retries: 2
                    statuses: INTERNAL_SERVER_ERROR,BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                    methods: GET
                    backoff:
                      firstBackoff: 500ms
                      maxBackoff: 2000ms
                      factor: 2
              metadata:
                response-timeout: 15000

            - id: support-service-openapi
              uri: http://support-service:8080
              predicates:
                - Path=/v3/api-docs/support-service
              filters:
                - SetPath=/v3/api-docs
                - name: Retry
                  args:
                    retries: 2
                    statuses: INTERNAL_SERVER_ERROR,BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                    methods: GET
                    backoff:
                      firstBackoff: 500ms
                      maxBackoff: 2000ms
                      factor: 2
              metadata:
                response-timeout: 15000

            - id: user-service-openapi
              uri: http://user-service:8080
              predicates:
                - Path=/v3/api-docs/user-service
              filters:
                - SetPath=/v3/api-docs
                - name: Retry
                  args:
                    retries: 2
                    statuses: INTERNAL_SERVER_ERROR,BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                    methods: GET
                    backoff:
                      firstBackoff: 500ms
                      maxBackoff: 2000ms
                      factor: 2
              metadata:
                response-timeout: 15000

            - id: fitness-plan-service-openapi
              uri: http://fitness-plan-service:8080
              predicates:
                - Path=/v3/api-docs/fitness-plan-service
              filters:
                - SetPath=/v3/api-docs
                - name: Retry
                  args:
                    retries: 2
                    statuses: INTERNAL_SERVER_ERROR,BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                    methods: GET
                    backoff:
                      firstBackoff: 500ms
                      maxBackoff: 2000ms
                      factor: 2
              metadata:
                response-timeout: 15000

            - id: order-service-openapi
              uri: http://order-service:8080
              predicates:
                - Path=/v3/api-docs/order-service
              filters:
                - SetPath=/v3/api-docs
                - name: Retry
                  args:
                    retries: 2
                    statuses: INTERNAL_SERVER_ERROR,BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                    methods: GET
                    backoff:
                      firstBackoff: 500ms
                      maxBackoff: 2000ms
                      factor: 2
              metadata:
