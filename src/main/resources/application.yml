resilience4j:
  circuitbreaker:
    instances:
      identity-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
      storage-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
  timelimiter:
    instances:
      identity-service:
        timeoutDuration: 30s
        cancelRunningFuture: true
      storage-service:
        timeoutDuration: 30s
        cancelRunningFuture: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

springdoc:
  pre-loading-enabled: true
  swagger-ui:
    use-root-path-mapping: true
    doc-expansion: none
    filter: true
    display-request-duration: true
    try-it-out-enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
    urls:
      - url: /v3/api-docs/identity-service
        name: identity-service
      - url: /v3/api-docs/catalog-service
        name: catalog-service
      - url: /v3/api-docs/notifications-service
        name: notifications-service
      - url: /v3/api-docs/payment-service
        name: payment-service
      - url: /v3/api-docs/support-service
        name: support-service
      - url: /v3/api-docs/user-service
        name: user-service
      - url: /v3/api-docs/fitness-plan-service
        name: fitness-plan-service
      - url: /v3/api-docs/order-service
        name: order-service

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
    az.fitnest.gateway: DEBUG

grpc:
  client:
    catalog-service:
      address: 'dns:///catalog-service.fitnest-dev.svc.cluster.local:9090'
      negotiation-type: plaintext

fitnest:
  rate-limit:
    limits:
      auth.login.post: 5
      auth.verify-otp.post: 5
      auth.request-otp.post: 3
      auth.resend-otp.post: 3
      auth.daily-otp.post: 10
      auth.send-reset-password-link.post: 2
      auth.reset-password.post: 5
      general.write: 60
      general.read: 300
ratelimit:
  reset-seconds: ${RATELIMIT_RESET_SECONDS:60}
