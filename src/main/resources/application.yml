                methods: GET
                backoff:
                  firstBackoff: 500ms
                  maxBackoff: 2000ms
                  factor: 2
          metadata:
            response-timeout: 15000


# Removed Eureka configuration as it conflicts with Kubernetes/Istio DNS

resilience4j:
  circuitbreaker:
    instances:
      identity-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
      storage-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
  timelimiter:
    instances:
      identity-service:
        timeoutDuration: 30s
        cancelRunningFuture: true
      storage-service:
        timeoutDuration: 30s
        cancelRunningFuture: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

springdoc:
  swagger-ui:
    use-root-path-mapping: true
    doc-expansion: none
    filter: true
    display-request-duration: true
    try-it-out-enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
    urls:
      - url: /v3/api-docs/identity-service
        name: identity-service
      - url: /v3/api-docs/marketplace-service
        name: marketplace-service
      - url: /v3/api-docs/notifications-service
        name: notifications-service
      - url: /v3/api-docs/payment-service
        name: payment-service
      - url: /v3/api-docs/support-service
        name: support-service
      - url: /v3/api-docs/user-service
        name: user-service
      - url: /v3/api-docs/fitness-plan-service
        name: fitness-plan-service
      - url: /v3/api-docs/order-service
        name: order-service

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
    az.fitnest.gateway: DEBUG

grpc:
  client:
    marketplace-service:
      address: 'dns:///marketplace-service.fitnest-dev.svc.cluster.local:9090'
      negotiation-type: plaintext
