server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:redis.fitnest-dev.svc.cluster.local}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:2000ms}
  cloud:
    gateway:
      routes:
        - id: iam-service
          uri: http://iam-service:8080
          predicates:
            - Path=/api/v1/auth/**,/api/v1/admin/**,/api/v1/users/**,/api/v1/profiles/**
          filters:
            - StripPrefix=0
            - RequestRateLimiter=redisRateLimiter

        - id: media-service
          uri: http://media-service:8086
          predicates:
            - Path=/api/v1/media/**
          filters:
            - StripPrefix=0

        - id: catalog-service
          uri: http://catalog-service:8080
          predicates:
            - Path=/api/v1/catalog/**,/api/v1/categories/**,/api/v1/products/**
          filters:
            - StripPrefix=0

        - id: commerce-service
          uri: http://commerce-service:8080
          predicates:
            - Path=/api/v1/cart/**,/api/v1/orders/**
          filters:
            - StripPrefix=0

        - id: fitmarket-service
          uri: http://fitmarket-service:8080
          predicates:
            - Path=/api/v1/trainers/**,/api/v1/programs/**
          filters:
            - StripPrefix=0

        - id: notifications-service
          uri: http://notifications-service:8080
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - StripPrefix=0

        - id: payment-service
          uri: http://payment-service:8080
          predicates:
            - Path=/api/v1/payments/**,/api/v1/wallets/**
          filters:
            - StripPrefix=0

        - id: subscription-service
          uri: http://subscription-service:8080
          predicates:
            - Path=/api/v1/subscriptions/**
          filters:
            - StripPrefix=0

        - id: support-service
          uri: http://support-service:8080
          predicates:
            - Path=/api/v1/support/**,/api/v1/tickets/**
          filters:
            - StripPrefix=0

        - id: user-service
          uri: http://user-service:8080
          predicates:
            - Path=/api/v1/users/**
          filters:
            - StripPrefix=0

        # Create one openapi route for each service isn't strictly necessary if springdoc manages it, 
        # but good for explicit proxying if needed.


# Removed Eureka configuration as it conflicts with Kubernetes/Istio DNS

resilience4j:
  circuitbreaker:
    instances:
      iam-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
      media-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
  timelimiter:
    instances:
      iam-service:
        timeoutDuration: 30s
        cancelRunningFuture: true
      media-service:
        timeoutDuration: 30s
        cancelRunningFuture: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
    urls:
      - url: /v3/api-docs/iam-service
        name: iam-service
      - url: /v3/api-docs/media-service
        name: media-service
      - url: /v3/api-docs/catalog-service
        name: catalog-service
      - url: /v3/api-docs/commerce-service
        name: commerce-service
      - url: /v3/api-docs/fitmarket-service
        name: fitmarket-service
      - url: /v3/api-docs/notifications-service
        name: notifications-service
      - url: /v3/api-docs/payment-service
        name: payment-service
      - url: /v3/api-docs/subscription-service
        name: subscription-service
      - url: /v3/api-docs/support-service
        name: support-service
      - url: /v3/api-docs/user-service
        name: user-service
