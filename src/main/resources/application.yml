server:
  port: 8080
  forward-headers-strategy: framework
  http2:
    enabled: ${SERVER_HTTP2_ENABLED:true}
  compression:
    enabled: true
    mime-types: application/json,text/plain,text/css,application/javascript,application/openapi+json
    min-response-size: 2048

spring:

  threads:
    virtual:
      enabled: true
  application:
    name: api-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    web-application-type: reactive
    lazy-initialization: ${SPRING_MAIN_LAZY_INITIALIZATION:false}
  messages:
    encoding: UTF-8
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${REDIS_HOST:redis}}
      port: ${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:${REDIS_TIMEOUT:2000ms}}
  
  cloud:
    openfeign:
      httpclient:
        hc5:
          enabled: true
          pool:
            max-connections: ${FEIGN_MAX_CONNECTIONS:200}
            max-connections-per-route: ${FEIGN_CONNECTIONS_PER_ROUTE:50}
            conn-pool-policy: LIFO
      client:
        config:
          default:
            connect-timeout: ${FEIGN_CONNECT_TIMEOUT:5000}
            read-timeout: ${FEIGN_READ_TIMEOUT:10000}
            logger-level: BASIC
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 8s
          routes:
            - id: identity-service
              uri: http://identity-service:8080
              predicates:
                - Path=/api/v1/identity/me,/api/v1/auth/**,/api/v1/legal/**,/api/v1/admin/users/**,/api/v1/admin/roles/**,/api/v1/admin/legal/**,/api/v1/me/change-email/**,/api/v1/me/change-mobile/**,/api/v1/me/change-password,/api/v1/me/deactivate,/api/v1/auth/registration/**,/api/v1/auth/password-recovery/**,/api/v1/me/delete-account
              filters:
                - StripPrefix=0
                - RequestRateLimiter=redisRateLimiter

            - id: catalog-media-stream
              uri: http://catalog-service:8080
              predicates:
                - Path=/api/v1/media/stream/**
              filters:
                - StripPrefix=0
              metadata:
                response-timeout: 60000 # Allow longer streaming time (60s)

            - id: storage-service
              uri: http://storage-service:8080
              predicates:
                - Path=/api/v1/media/**
              filters:
                - StripPrefix=0
              metadata:
                response-timeout: 60000 # Increased timeout for streaming (60s)

            - id: catalog-service
              uri: http://catalog-service:8080
              predicates:
                - Path=/api/v1/catalog/**,/api/v1/stores/**,/api/v1/gyms/**,/api/v1/categories/**,/api/v1/checkout/**,/api/v1/admin/stores/**,/api/v1/admin/gyms/**,/api/v1/admin/categories/**,/api/v1/super-admin/**
              filters:
                - StripPrefix=0


            - id: notifications-service
              uri: http://notifications-service:8080
              predicates:
                - Path=/api/v1/notifications/**,/api/v1/sms/**,/api/v1/devices/**,/api/v1/admin/notifications/**
              filters:
                - StripPrefix=0

            - id: payment-service
              uri: http://payment-service:8080
              predicates:
                - Path=/api/v1/payments/**,/api/v1/wallets/**,/api/v1/me/cards/**,/api/v1/admin/payments/**,/api/v1/admin/idempotency/**,/epoint/**,/payment/**
              filters:
                - StripPrefix=0


            - id: support-service
              uri: http://support-service:8080
              predicates:
                - Path=/api/v1/support/**,/api/v1/tickets/**,/api/v1/faqs/**,/api/v1/admin/faqs/**,/api/v1/admin/tickets/**
              filters:
                - StripPrefix=0

            - id: fitness-plan-service
              uri: http://fitness-plan-service:8080
              predicates:
                - Path=/api/v1/nutrition-plans/**,/api/v1/workout-plans/**
              filters:
                - StripPrefix=0

            - id: argocd
              uri: http://argocd-server.argocd.svc:8080
              predicates:
                - Path=/api/v1/applications/**,/api/v1/stream/applications/**
              filters:
                - StripPrefix=0

            - id: order-service
              uri: http://order-service:8080
              predicates:
                - Path=/api/v1/subscription-packages/**,/api/v1/me/subscriptions/**,/api/v1/subscriptions/upgrade/**,/api/v1/orders/**,/api/v1/admin/subscriptions/**,/api/v1/admin/plans/**
              filters:
                - StripPrefix=0

            - id: user-service
              uri: http://user-service:8080
              predicates:
                - Path=/api/v1/me,/api/v1/users/**,/api/v1/files/**,/api/v1/goals/**,/api/v1/languages/**,/api/v1/favorites/**,/api/v1/translations/**,/api/v1/admin/goals/**,/api/v1/recent-searches/**
              filters:
                - StripPrefix=0
                - RequestRateLimiter=redisRateLimiter


            - id: identity-service-openapi
              uri: http://identity-service:8080
              predicates:
                - Path=/v3/api-docs/identity-service
              filters:
                - SetPath=/v3/api-docs
                - name: Retry
                  args:
                    retries: 2
                    statuses: INTERNAL_SERVER_ERROR,BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                    methods: GET
                    backoff:
                      firstBackoff: 500ms
                      maxBackoff: 2000ms
                      factor: 2
              metadata:
                response-timeout: 15000

            - id: catalog-service-openapi
              uri: http://catalog-service:8080
              predicates:
                - Path=/v3/api-docs/catalog-service
              filters:
                - SetPath=/v3/api-docs
                - name: Retry
                  args:
                    retries: 2
                    statuses: INTERNAL_SERVER_ERROR,BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                    methods: GET
                    backoff:
                      firstBackoff: 500ms
                      maxBackoff: 2000ms
                      factor: 2
              metadata:
                response-timeout: 15000

            - id: notifications-service-openapi
              uri: http://notifications-service:8080
              predicates:
                - Path=/v3/api-docs/notifications-service
              filters:
                - SetPath=/v3/api-docs
                - name: Retry
                  args:
                    retries: 2
                    statuses: INTERNAL_SERVER_ERROR,BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                    methods: GET
                    backoff:
                      firstBackoff: 500ms
                      maxBackoff: 2000ms
                      factor: 2
              metadata:
                response-timeout: 15000

            - id: payment-service-openapi
              uri: http://payment-service:8080
              predicates:
                - Path=/v3/api-docs/payment-service
              filters:
                - SetPath=/v3/api-docs
                - name: Retry
                  args:
                    retries: 2
                    statuses: INTERNAL_SERVER_ERROR,BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                    methods: GET
                    backoff:
                      firstBackoff: 500ms
                      maxBackoff: 2000ms
                      factor: 2
              metadata:
                response-timeout: 15000

            - id: support-service-openapi
              uri: http://support-service:8080
              predicates:
                - Path=/v3/api-docs/support-service
              filters:
                - SetPath=/v3/api-docs
                - name: Retry
                  args:
                    retries: 2
                    statuses: INTERNAL_SERVER_ERROR,BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                    methods: GET
                    backoff:
                      firstBackoff: 500ms
                      maxBackoff: 2000ms
                      factor: 2
              metadata:
                response-timeout: 15000

            - id: user-service-openapi
              uri: http://user-service:8080
              predicates:
                - Path=/v3/api-docs/user-service
              filters:
                - SetPath=/v3/api-docs
                - name: Retry
                  args:
                    retries: 2
                    statuses: INTERNAL_SERVER_ERROR,BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                    methods: GET
                    backoff:
                      firstBackoff: 500ms
                      maxBackoff: 2000ms
                      factor: 2
              metadata:
                response-timeout: 15000

            - id: fitness-plan-service-openapi
              uri: http://fitness-plan-service:8080
              predicates:
                - Path=/v3/api-docs/fitness-plan-service
              filters:
                - SetPath=/v3/api-docs
                - name: Retry
                  args:
                    retries: 2
                    statuses: INTERNAL_SERVER_ERROR,BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                    methods: GET
                    backoff:
                      firstBackoff: 500ms
                      maxBackoff: 2000ms
                      factor: 2
              metadata:
                response-timeout: 15000

            - id: order-service-openapi
              uri: http://order-service:8080
              predicates:
                - Path=/v3/api-docs/order-service
              filters:
                - SetPath=/v3/api-docs
                - name: Retry
                  args:
                    retries: 2
                    statuses: INTERNAL_SERVER_ERROR,BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                    methods: GET
                    backoff:
                      firstBackoff: 500ms
                      maxBackoff: 2000ms
                      factor: 2
              metadata:
                response-timeout: 15000


resilience4j:
  circuitbreaker:
    instances:
      identity-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
      storage-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
  timelimiter:
    instances:
      identity-service:
        timeoutDuration: 30s
        cancelRunningFuture: true
      storage-service:
        timeoutDuration: 30s
        cancelRunningFuture: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

springdoc:
  pre-loading-enabled: true
  swagger-ui:
    use-root-path-mapping: true
    doc-expansion: none
    filter: true
    display-request-duration: true
    try-it-out-enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
    urls:
      - url: /v3/api-docs/identity-service
        name: identity-service
      - url: /v3/api-docs/catalog-service
        name: catalog-service
      - url: /v3/api-docs/notifications-service
        name: notifications-service
      - url: /v3/api-docs/payment-service
        name: payment-service
      - url: /v3/api-docs/support-service
        name: support-service
      - url: /v3/api-docs/user-service
        name: user-service
      - url: /v3/api-docs/fitness-plan-service
        name: fitness-plan-service
      - url: /v3/api-docs/order-service
        name: order-service

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
    az.fitnest.gateway: DEBUG

grpc:
  client:
    catalog-service:
      address: 'dns:///catalog-service.fitnest-dev.svc.cluster.local:9090'
      negotiation-type: plaintext
