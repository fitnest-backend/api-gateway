server:
  port: 8080
  forward-headers-strategy: framework
  http2:
    enabled: ${SERVER_HTTP2_ENABLED:true}
  compression:
    enabled: true
    mime-types: application/json,text/plain,text/css,application/javascript,application/openapi+json
    min-response-size: 2048

spring:
  application:
    name: api-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    lazy-initialization: ${SPRING_MAIN_LAZY_INITIALIZATION:false}
  data:
    redis:
      host: ${SPRING_REDIS_HOST:${REDIS_HOST:redis}}
      port: ${SPRING_REDIS_PORT:${REDIS_PORT:6379}}
      timeout: ${SPRING_REDIS_TIMEOUT:${REDIS_TIMEOUT:2000ms}}
  
  cloud:
    openfeign:
      httpclient:
        hc5:
          enabled: true
          pool:
            max-connections: ${FEIGN_MAX_CONNECTIONS:200}
            max-connections-per-route: ${FEIGN_CONNECTIONS_PER_ROUTE:50}
            conn-pool-policy: LIFO
      client:
        config:
          default:
            connect-timeout: ${FEIGN_CONNECT_TIMEOUT:5000}
            read-timeout: ${FEIGN_READ_TIMEOUT:10000}
            logger-level: BASIC
    gateway:
      httpclient:
        connect-timeout: 2000
        response-timeout: 8s
      routes:
        - id: identity-service
          uri: http://identity-service:8080
          predicates:
            - Path=/api/v1/auth/register,/api/v1/auth/register/complete,/api/v1/auth/login,/api/v1/auth/refresh,/api/v1/auth/logout,/api/v1/auth/me,/api/v1/auth/otp/send,/api/v1/auth/otp/verify,/api/v1/admin/users,/api/v1/admin/users/*,/api/v1/admin/users/*/role,/api/v1/admin/legal/**,/api/v1/legal/privacy-policy,/api/v1/legal/terms-of-use,/api/v1/legal/consents/accept,/api/v1/me/consents
          filters:
            - StripPrefix=0
            - RequestRateLimiter=redisRateLimiter

        - id: storage-service
          uri: http://storage-service:8080
          predicates:
            - Path=/api/v1/media/**
          filters:
            - StripPrefix=0

        - id: marketplace-service
          uri: http://marketplace-service:8080
          predicates:
            - Path=/api/v1/marketplace/**,/api/v1/stores/**,/api/v1/admin/categories/**,/api/v1/checkout/**
          filters:
            - StripPrefix=0


        - id: notifications-service
          uri: http://notifications-service:8080
          predicates:
            - Path=/api/v1/notifications/**,/api/v1/sms/**
          filters:
            - StripPrefix=0

        - id: payment-service
          uri: http://payment-service:8080
          predicates:
            - Path=/api/v1/payments/**,/api/v1/wallets/**
          filters:
            - StripPrefix=0


        - id: support-service
          uri: http://support-service:8080
          predicates:
            - Path=/api/v1/support/**,/api/v1/tickets/**
          filters:
            - StripPrefix=0

        - id: fitness-plan-service
          uri: http://fitness-plan-service:8080
          predicates:
            - Path=/api/v1/nutrition-plans/**,/api/v1/workout-plans/**
          filters:
            - StripPrefix=0

        - id: argocd
          uri: http://argocd-server.argocd.svc:8080
          predicates:
            - Path=/api/v1/applications/**,/api/v1/stream/applications/**
          filters:
            - StripPrefix=0

        - id: user-service
          uri: http://user-service:8080
          predicates:
            - Path=/api/v1/users/**,/api/v1/me,/api/v1/me/**,/api/v1/files/**,/api/v1/goals/**,/api/v1/languages/**,/api/v1/favorites/**,/api/v1/translations/**
          filters:
            - StripPrefix=0
            - RequestRateLimiter=redisRateLimiter

        - id: order-service
          uri: http://order-service:8080
          predicates:
            - Path=/api/v1/subscription-packages/**,/api/v1/me/subscriptions/**,/api/v1/subscriptions/upgrade/**,/api/v1/orders/**
          filters:
            - StripPrefix=0

        # OpenAPI doc proxy routes
        - id: identity-service-openapi
          uri: http://identity-service:8080
          predicates:
            - Path=/v3/api-docs/identity-service
          filters:
            - SetPath=/v3/api-docs
            - name: Retry
              args:
                retries: 2
                statuses: INTERNAL_SERVER_ERROR,BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET
                backoff:
                  firstBackoff: 500ms
                  maxBackoff: 2000ms
                  factor: 2
          metadata:
            response-timeout: 15000

        - id: marketplace-service-openapi
          uri: http://marketplace-service:8080
          predicates:
            - Path=/v3/api-docs/marketplace-service
          filters:
            - SetPath=/v3/api-docs
            - name: Retry
              args:
                retries: 2
                statuses: INTERNAL_SERVER_ERROR,BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET
                backoff:
                  firstBackoff: 500ms
                  maxBackoff: 2000ms
                  factor: 2
          metadata:
            response-timeout: 15000

        - id: notifications-service-openapi
          uri: http://notifications-service:8080
          predicates:
            - Path=/v3/api-docs/notifications-service
          filters:
            - SetPath=/v3/api-docs
            - name: Retry
              args:
                retries: 2
                statuses: INTERNAL_SERVER_ERROR,BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET
                backoff:
                  firstBackoff: 500ms
                  maxBackoff: 2000ms
                  factor: 2
          metadata:
            response-timeout: 15000

        - id: payment-service-openapi
          uri: http://payment-service:8080
          predicates:
            - Path=/v3/api-docs/payment-service
          filters:
            - SetPath=/v3/api-docs
            - name: Retry
              args:
                retries: 2
                statuses: INTERNAL_SERVER_ERROR,BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET
                backoff:
                  firstBackoff: 500ms
                  maxBackoff: 2000ms
                  factor: 2
          metadata:
            response-timeout: 15000

        - id: support-service-openapi
          uri: http://support-service:8080
          predicates:
            - Path=/v3/api-docs/support-service
          filters:
            - SetPath=/v3/api-docs
            - name: Retry
              args:
                retries: 2
                statuses: INTERNAL_SERVER_ERROR,BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET
                backoff:
                  firstBackoff: 500ms
                  maxBackoff: 2000ms
                  factor: 2
          metadata:
            response-timeout: 15000

        - id: user-service-openapi
          uri: http://user-service:8080
          predicates:
            - Path=/v3/api-docs/user-service
          filters:
            - SetPath=/v3/api-docs
            - name: Retry
              args:
                retries: 2
                statuses: INTERNAL_SERVER_ERROR,BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET
                backoff:
                  firstBackoff: 500ms
                  maxBackoff: 2000ms
                  factor: 2
          metadata:
            response-timeout: 15000

        - id: fitness-plan-service-openapi
          uri: http://fitness-plan-service:8080
          predicates:
            - Path=/v3/api-docs/fitness-plan-service
          filters:
            - SetPath=/v3/api-docs
            - name: Retry
              args:
                retries: 2
                statuses: INTERNAL_SERVER_ERROR,BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET
                backoff:
                  firstBackoff: 500ms
                  maxBackoff: 2000ms
                  factor: 2
          metadata:
            response-timeout: 15000

        - id: order-service-openapi
          uri: http://order-service:8080
          predicates:
            - Path=/v3/api-docs/order-service
          filters:
            - SetPath=/v3/api-docs
            - name: Retry
              args:
                retries: 2
